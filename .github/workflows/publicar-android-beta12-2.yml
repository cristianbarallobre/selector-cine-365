name: Publicar v9 Beta 12.2 - Android actualizado y Windows/Mac originales
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/publicar-android-beta12-2.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cine-beta12-2-release
  cancel-in-progress: false
jobs:
  distribuir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recuperar APK UNSIGNED exacta de CI aprobada
        uses: actions/download-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_BETA12_2_unsigned
          repository: cristianbarallobre/selector-cine-365
          run-id: 44806971301
          github-token: ${{ github.token }}
          path: unsigned
      - name: Regresiones e integridad del delta público
        run: |
          node scripts/test_android_safe_area_beta12_2.cjs
          echo "b77ca44b24cf5d03bf3da2a3a0cdf716c0f5b87835e5d9bd5a2de071c06738cc  scripts/release/beta12_2_android_signed_delta.b64" | sha256sum -c
          test -s unsigned/Selector_Cine_365_Android_v9_BETA12_2_UNSIGNED.apk
      - name: Reconstruir APK firmada original y verificar certificado y firma v2-v3
        run: |
          mkdir -p dist
          python3 scripts/release/reconstruct_signed_beta12_2.py \
            unsigned/Selector_Cine_365_Android_v9_BETA12_2_UNSIGNED.apk \
            scripts/release/beta12_2_android_signed_delta.b64 \
            dist/Selector_Cine_365_Android_v9_BETA12_2.apk
          java -jar unsigned/android-tools/lib/apksigner.jar verify --verbose --print-certs \
            dist/Selector_Cine_365_Android_v9_BETA12_2.apk | tee /tmp/cine-apksigner.txt
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cine-apksigner.txt
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cine-apksigner.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: b8a17f39e4fa24d7c110d452161425c7524412c3a5a4d7459b1132ffd0825fb6' /tmp/cine-apksigner.txt
          echo 'dcbcae51dbe47cfdf9ffc0273ceb08077bca95d3391a0b98989e97f60e955554  dist/Selector_Cine_365_Android_v9_BETA12_2.apk' | sha256sum -c
      - name: Instalar conversores de documentación PDF y Word
        run: |
          python -m pip install --disable-pip-version-check 'mistune>=3,<4' 'weasyprint>=68,<70' 'reportlab>=4.4,<5' 'pypdf>=5,<7' 'python-docx>=1,<2'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fonts-liberation fonts-dejavu-core
      - name: Regenerar manuales y el historial completo hasta Beta 12.2
        run: |
          python scripts/generar_manual_completo.py
          python scripts/generar_guia_azure_entra_onedrive.py docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.md docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf
          pandoc docs/HISTORIAL_V9_BETA12.md --from=gfm --to=docx \
            --reference-doc=docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.docx \
            --metadata=lang:es-ES --metadata=title:'Selector Cine 365 - Historial hasta v9 Beta 12.2' \
            -o docs/Selector_Cine_365_Historial_v9_BETA12.docx
          mkdir -p /tmp/cine365-lo
          libreoffice -env:UserInstallation=file:///tmp/cine365-lo/profile --headless --convert-to pdf \
            --outdir docs docs/Selector_Cine_365_Historial_v9_BETA12.docx
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          for name,terms in [
            ('MANUAL_COMPLETO_SELECTOR_CINE_365.pdf',['Beta 12.2','Android','OneDrive']),
            ('GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf',['Beta 12.2','OneDrive']),
            ('Selector_Cine_365_Historial_v9_BETA12.pdf',['Beta 12.2','Beta 12.1','Beta 12','Android'])
          ]:
            p=Path('docs')/name
            assert p.is_file() and p.stat().st_size>12000,p
            text=' '.join(page.extract_text() or '' for page in PdfReader(p).pages)
            for term in terms:assert term in text,(p,term)
          docx=Path('docs/Selector_Cine_365_Historial_v9_BETA12.docx')
          assert docx.stat().st_size>20000
          assert 'Beta 12.2' in '\n'.join(p.text for p in Document(docx).paragraphs)
          print('Manuales y Word/PDF actualizados y verificados')
          PY
      - name: Reutilizar EXACTAMENTE los paquetes Windows/Mac originales de Beta12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v9.0.0-beta.12 \
            --pattern 'Selector_Cine_365_Windows_v9_BETA12.zip' --dir dist
          gh release download v9.0.0-beta.12 \
            --pattern 'Selector_Cine_365_Mac_Apple_Silicon_v9_BETA12.zip' --dir dist
          gh release download v9.0.0-beta.12 \
            --pattern 'Selector_Cine_365_Mac_Intel_v9_BETA12.zip' --dir dist
          echo '80afe9f2ee9e0dba29aa5d3cd90efe3f435b2931a127dee5da1375bbf5b5a35f  dist/Selector_Cine_365_Windows_v9_BETA12.zip' | sha256sum -c
          echo '201020f325b972ca44207812bbe3bbc3f77ba9b4b0048e837cb226e5c0ee9ec3  dist/Selector_Cine_365_Mac_Apple_Silicon_v9_BETA12.zip' | sha256sum -c
          echo 'dfa1c29753367c91cc8906957057960fe2b2fec6509fe5a5ec30a1d6908345ec  dist/Selector_Cine_365_Mac_Intel_v9_BETA12.zip' | sha256sum -c
          unzip -t dist/Selector_Cine_365_Windows_v9_BETA12.zip | tail -1
          unzip -t dist/Selector_Cine_365_Mac_Apple_Silicon_v9_BETA12.zip | tail -1
          unzip -t dist/Selector_Cine_365_Mac_Intel_v9_BETA12.zip | tail -1
          cp docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf dist/
          cp docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf dist/
          cp docs/Selector_Cine_365_Historial_v9_BETA12.pdf dist/
          cp docs/Selector_Cine_365_Historial_v9_BETA12.docx dist/
      - name: Publicar release coordinada v9 Beta 12.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v9.0.0-beta.12.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES_v9_BETA12_2.md --prerelease
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Selector Cine 365 v9 Beta 12.2 — Android notch hotfix' \
              --notes-file RELEASE_NOTES_v9_BETA12_2.md
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
      - name: Guardar en main los PDF y Word actualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf docs/Selector_Cine_365_Historial_v9_BETA12.pdf docs/Selector_Cine_365_Historial_v9_BETA12.docx
          if ! git diff --cached --quiet; then
            git commit -m 'docs(beta12.2): generar manuales y nuevo historial PDF/Word'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_v9_BETA12_2_Distribucion
          path: dist/*
          if-no-files-found: error
