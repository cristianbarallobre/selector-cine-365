name: Publicar Selector Cine 365 v9.0.0 estable
on:
  push:
    branches: ['main']
    paths: ['.release/PUBLICAR_ESTABLE_V9.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: selector-cine-v9-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Comprobar fuente y versión estable
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          grep -F 'v9.0.0' README.md
          grep -F 'es.cine365.app.limpia' docs/MANUAL_COMPLETO_SELECTOR_CINE_365.md
          test -s RELEASE_NOTES_v9_ESTABLE.md
      - name: Descargar los binarios probados de Beta 14 sin recompilar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original dist
          gh release download 'v9.0.0-beta.14' --dir original --pattern '*'
          (cd original && sha256sum --check SHA256SUMS.txt)
          for f in \
            Selector_Cine_365_Windows_Beta14.exe \
            Selector_Cine_365_Android_Beta13_13_Limpia.apk \
            Selector_Cine_365_Mac_Intel_Beta14.zip \
            Selector_Cine_365_Mac_AppleSilicon_Beta14.zip; do
            test -s "original/$f"
            cp "original/$f" "dist/$f"
            cmp "original/$f" "dist/$f"
          done
          echo '4d3459de746dd69c82232cc2aa222fdcb601c358145172e44b1887be59297130  dist/Selector_Cine_365_Windows_Beta14.exe' | sha256sum -c -
          echo 'c5a24883dfbe3f2806401629a6f93780941c00769fca6f4053a3068cfcfe8fcd  dist/Selector_Cine_365_Android_Beta13_13_Limpia.apk' | sha256sum -c -
          file dist/Selector_Cine_365_Windows_Beta14.exe | grep 'PE32+ executable'
          unzip -t dist/Selector_Cine_365_Mac_Intel_Beta14.zip | tail -1
          unzip -t dist/Selector_Cine_365_Mac_AppleSilicon_Beta14.zip | tail -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar certificado Android y package ID oficial
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'build-tools;35.0.0' 'platforms;android-35'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/Selector_Cine_365_Android_Beta13_13_Limpia.apk > /tmp/cine-v9-cert.txt
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cine-v9-cert.txt
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cine-v9-cert.txt
          grep -Fxi 'Signer #1 certificate SHA-256 digest: b8a17f39e4fa24d7c110d452161425c7524412c3a5a4d7459b1132ffd0825fb6' /tmp/cine-v9-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            dist/Selector_Cine_365_Android_Beta13_13_Limpia.apk | \
            grep -F "package: name='es.cine365.app.limpia' versionCode='9027' versionName='9.0.0-beta.13.13'"
      - name: Instalar conversores de documentación
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils fonts-dejavu-core fonts-liberation
      - name: Regenerar manual, guía Microsoft, guía de seguridad e historial en PDF y Word
        shell: bash
        run: |
          set -euo pipefail
          pandoc docs/MANUAL_COMPLETO_SELECTOR_CINE_365.md -f gfm -t docx \
            --metadata=lang:es-ES \
            --metadata=title:'Selector Cine 365 — Manual completo v9.0.0 estable' \
            -o docs/MANUAL_COMPLETO_SELECTOR_CINE_365.docx
          pandoc docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.md -f gfm -t docx \
            --metadata=lang:es-ES \
            -o docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.docx
          pandoc docs/GUIA_SINCRONIZACION_SEGURA.md -f gfm -t docx \
            --metadata=lang:es-ES \
            -o docs/GUIA_SINCRONIZACION_SEGURA.docx
          pandoc CHANGELOG.md -f gfm -t docx \
            --metadata=lang:es-ES \
            -o docs/HISTORIAL_V9_ESTABLE.docx
          rm -f docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf \
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf \
            docs/GUIA_SINCRONIZACION_SEGURA.pdf \
            docs/HISTORIAL_V9_ESTABLE.pdf
          libreoffice -env:UserInstallation=file:///tmp/cine365-v9stable-profile \
            --headless --convert-to pdf --outdir docs \
            docs/MANUAL_COMPLETO_SELECTOR_CINE_365.docx \
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.docx \
            docs/GUIA_SINCRONIZACION_SEGURA.docx \
            docs/HISTORIAL_V9_ESTABLE.docx
          for base in MANUAL_COMPLETO_SELECTOR_CINE_365 GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365 GUIA_SINCRONIZACION_SEGURA HISTORIAL_V9_ESTABLE; do
            test -s "docs/$base.docx"
            test -s "docs/$base.pdf"
            pdfinfo "docs/$base.pdf" | grep '^Pages:'
            pdftotext "docs/$base.pdf" /tmp/cine-v9-document.txt
            test "$(wc -c < /tmp/cine-v9-document.txt)" -gt 650
            pdftoppm -f 1 -l 1 -scale-to 1000 -png -singlefile \
              "docs/$base.pdf" "/tmp/preview-$base" >/dev/null 2>&1
            test -s "/tmp/preview-$base.png"
            cp "docs/$base.docx" "dist/$base.docx"
            cp "docs/$base.pdf" "dist/$base.pdf"
          done
      - name: Guardar manuales actualizados en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MANUAL_COMPLETO_SELECTOR_CINE_365.docx docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf \
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.docx \
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf \
            docs/GUIA_SINCRONIZACION_SEGURA.docx docs/GUIA_SINCRONIZACION_SEGURA.pdf \
            docs/HISTORIAL_V9_ESTABLE.docx docs/HISTORIAL_V9_ESTABLE.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(stable): generate v9.0.0 current PDF and DOCX manuals'
            git push origin HEAD:main
          fi
      - name: Preparar notas, fuentes y manifiesto de la versión estable
        shell: bash
        run: |
          set -euo pipefail
          cp RELEASE_NOTES_v9_ESTABLE.md dist/NOTAS_VERSION_v9_ESTABLE.md
          cp README.md dist/LEEME_SELECTOR_CINE_365_v9_ESTABLE.md
          cp CHANGELOG.md dist/HISTORIAL_V9_ESTABLE.md
          cp docs/MANUAL_COMPLETO_SELECTOR_CINE_365.md dist/MANUAL_COMPLETO_SELECTOR_CINE_365.md
          cp docs/GUIA_SINCRONIZACION_SEGURA.md dist/GUIA_SINCRONIZACION_SEGURA.md
          cp docs/POLITICA_DE_RELEASES.md dist/POLITICA_DE_RELEASES.md
          git archive --format=zip -o dist/Selector_Cine_365_Codigo_Fuente_v9.0.0.zip HEAD
          (cd dist && sha256sum -- *.exe *.apk *.zip *.docx *.pdf *.md > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'Selector_Cine_365_Mac_*.zip' | wc -l)" -eq 2
      - name: Publicar release estable y marcar Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v9.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Ya existe una versión estable v9.0.0. Nunca sobrescribir una publicación inmutable."
            exit 1
          fi
          COMMIT="$(git rev-parse HEAD)"
          gh release create "$TAG" dist/* \
            --target "$COMMIT" \
            --title 'Selector Cine 365 v9.0.0 — versión ESTABLE (Windows, Android y Mac)' \
            --notes-file RELEASE_NOTES_v9_ESTABLE.md \
            --latest
          gh release view "$TAG" --json tagName,isPrerelease,isDraft,assets,url \
            --jq '{tag:.tagName, prerelease:.isPrerelease, draft:.isDraft, url:.url,files:[.assets[].name]}'
