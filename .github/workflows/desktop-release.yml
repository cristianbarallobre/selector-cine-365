name: Escritorio 9.2.25 · macOS y Windows
on:
  push:
    branches: [release/desktop-9.2.25]
permissions:
  contents: read
concurrency:
  group: selector-cine-desktop-9.2.25
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/release/desktop-9.2.25'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.4' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: go test -count=1 ./...
      - run: go test -tags lab -count=1 ./...
      - shell: pwsh
        run: |
          foreach ($f in @(Get-ChildItem scripts/test_lab*.cjs) + @(Get-Item scripts/test_beta14_desktop_dropdowns.cjs,scripts/test_windows_restore.cjs,scripts/test_txt_import_creates_list_beta14.cjs,scripts/test_desktop_save_recovery.cjs,scripts/test_durable_save.cjs,scripts/test_sync_header.cjs)) {
            node $f.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - run: go build -trimpath -ldflags="-H windowsgui -s -w" -o Selector_Cine_365_Windows_9.2.25.exe .
        env: { CGO_ENABLED: '0' }
      - uses: actions/upload-artifact@v4
        with: { name: Windows, path: Selector_Cine_365_Windows_9.2.25.exe, if-no-files-found: error }
  mac:
    if: github.ref == 'refs/heads/release/desktop-9.2.25'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, arch: arm64, label: Apple_Silicon}
          - {runner: macos-15-intel, arch: amd64, label: Intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MAC_ARCH: ${{ matrix.arch }}
      MAC_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11' } # Compatible con macOS 12.
      - name: Llavero temporal para las pruebas de sesión
        run: |
          kc="$RUNNER_TEMP/cine-tests.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security default-keychain -d user -s "$kc"
          security list-keychains -d user -s "$kc"
      - run: bash scripts/build_macos_app.sh
        env: { CC: clang }
      - run: bash scripts/test_macos_package.sh "dist/Selector_Cine_365_Mac_${MAC_LABEL}_9.2.25.zip"
        if: matrix.arch == 'amd64'
      - uses: actions/upload-artifact@v4
        with:
          name: Mac_${{ matrix.label }}
          path: dist/Selector_Cine_365_Mac_*_9.2.25.zip
          if-no-files-found: error
  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          if gh release view v9.2.25-desktop >/dev/null 2>&1; then exit 0; fi
          test "$(gh api "repos/$GH_REPO/git/ref/heads/release/desktop-9.2.25" --jq .object.sha)" = "$GITHUB_SHA"
          sha256sum Selector_Cine_365_* > SHA256SUMS.txt
          gh release create v9.2.25-desktop --target "$GITHUB_SHA" --latest --title "Selector Cine 365 · Mac y Windows 9.2.25" --notes "Edición exclusiva para Windows y macOS. Limpieza del código, las pruebas y la documentación obsoletos. Conserva el guardado local, las copias adicionales y la recuperación de la biblioteca." Selector_Cine_365_* SHA256SUMS.txt
