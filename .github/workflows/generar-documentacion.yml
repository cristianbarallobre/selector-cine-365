name: Generar historial oficial Word y PDF

# Archivo histórico v8.1.1: regeneración MANUAL para evitar publicaciones concurrentes y correos de fallo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  documentos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Instalar conversores y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fonts-liberation

      - name: Generar Word y PDF
        run: |
          # Archivo HISTORICO v8.1.1: no mezclar con manual ni changelog v9.
          # Dos etapas para conservar las tablas HTML de las fichas de versiones.
          # La conversión directa de GFM a DOCX descarta esas tablas.
          pandoc docs/HISTORIAL_VERSIONES.md \
            --from=gfm --to=html \
            -o /tmp/selector-cine-historial.html
          sed -i 's#../icon.png#icon.png#g' /tmp/selector-cine-historial.html
          pandoc /tmp/selector-cine-historial.html \
            --from=html --to=docx \
            --resource-path=. \
            -o docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.docx
          mkdir -p /tmp/selector-cine-lo
          libreoffice \
            -env:UserInstallation=file:///tmp/selector-cine-lo/profile \
            --headless --convert-to pdf \
            --outdir docs \
            docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.docx
          test -s docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.docx
          test -s docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.pdf

      - name: Guardar documentos generados en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.docx docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publicar historial Word y PDF de v8.1.1"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
