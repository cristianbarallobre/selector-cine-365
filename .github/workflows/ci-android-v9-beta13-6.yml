name: CI Android Beta 13.12 - TMDB visible details and clean install
on:
  push:
    branches: ['fix/android-beta13-6-tmdb-resume']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run safety regression tests
        run: |
          node scripts/test_android_manual_sync_beta13_3.cjs
          node scripts/test_android_onedrive_efficiency.cjs
          node scripts/test_android_onedrive_auto_beta13_5.cjs
          node scripts/test_v9_beta13.cjs
          node scripts/test_android_tmdb_resume_beta13_6.cjs
          node scripts/test_export_txt_name_android_beta13_6.cjs
          node scripts/test_txt_import_creates_list_beta14.cjs android/app/src/main/assets/index.html
          node scripts/test_android_private_storage_beta13_8.cjs
          node scripts/test_android_fresh_install_beta13_11.cjs
          node scripts/test_android_tmdb_visible_fill_beta13_12.cjs
      - name: Run Java unit tests and build clean-install test APK + unsigned release
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Verify debug APK signing and version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "versionCode='9025' versionName='9.0.0-beta.13.12'"
      # Official public Android SDK signing tool only. NEVER store private keys
      # or passwords in GitHub Actions artifacts.
      - name: Copy official public apksigner
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-apksigner-public-tool
          path: android/apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_BETA13_12_UNSIGNED
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      # Signed with CI's *temporary debug certificate*, deliberately NOT the
      # original release key. For clean-install physical tests only; this APK
      # is not suitable for in-place updating production/release APKs.
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_Beta13_12_CLEAN_INSTALL_DEBUG_SIGNED
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
