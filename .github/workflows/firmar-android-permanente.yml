name: Firmar APK Android con certificado permanente
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-firmada:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-signing
    env:
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Comprobar pruebas y compilar APK de distribución sin firmar
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Firmar con la clave privada almacenada en secretos de GitHub
        shell: bash
        env:
          CINE_P12_BASE64: ${{ secrets.ANDROID_SIGNING_P12_BASE64 }}
          CINE_P12_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CINE_P12_BASE64" || -z "$CINE_P12_PASSWORD" ]]; then
            echo "::error::Faltan los secretos ANDROID_SIGNING_P12_BASE64 o ANDROID_SIGNING_PASSWORD. No se genera APK con firma temporal."
            exit 1
          fi
          umask 077
          export CINE_KEYSTORE_PATH="$RUNNER_TEMP/cine365-signing.p12"
          trap 'rm -f "$CINE_KEYSTORE_PATH"' EXIT
          printf '%s' "$CINE_P12_BASE64" | base64 --decode > "$CINE_KEYSTORE_PATH"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$CINE_KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias cine365 \
            --ks-pass env:CINE_P12_PASSWORD \
            --key-pass env:CINE_P12_PASSWORD \
            --out dist/Selector_Cine_365_Android_FIRMA_PERMANENTE.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs \
            dist/Selector_Cine_365_Android_FIRMA_PERMANENTE.apk > "$RUNNER_TEMP/cine365-cert-check.txt"
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/cine365-cert-check.txt"
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/cine365-cert-check.txt"
          grep -Fxi 'Signer #1 certificate SHA-256 digest: b8a17f39e4fa24d7c110d452161425c7524412c3a5a4d7459b1132ffd0825fb6' "$RUNNER_TEMP/cine365-cert-check.txt"
          sha256sum dist/Selector_Cine_365_Android_FIRMA_PERMANENTE.apk > dist/SHA256.txt
          echo 'APK firmada con el certificado original comprobado. La clave privada no se publica.'
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_FIRMADA_PERMANENTE
          path: dist/*
          if-no-files-found: error
