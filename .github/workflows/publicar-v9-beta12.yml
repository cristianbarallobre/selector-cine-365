name: Publicar Selector Cine 365 v9 Beta 12 (Windows Mac Android)
on:
  push:
    branches: [release/v9-beta12-windows-android-macos]
    paths:
      - '.github/workflows/publicar-v9-beta12.yml'
      - 'scripts/build_macos_app.sh'
      - 'scripts/release/**'
      - 'RELEASE_NOTES_v9_BETA12.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: selector-cine-beta12-publicar
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple_Silicon
            cc: 'clang -arch arm64'
          - arch: amd64
            label: Intel
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de regresión v9, compilación, firma y empaquetado nativo
        env:
          MAC_ARCH: ${{ matrix.arch }}
          MAC_LABEL: ${{ matrix.label }}
          CC: ${{ matrix.cc }}
        run: |
          node scripts/test_v9_beta12.cjs
          bash scripts/build_macos_app.sh
          APP="dist/Selector Cine 365.app"
          test -s "$APP/Contents/MacOS/SelectorCine365"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist" | grep -Fx '9012'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | grep -Fx '9.0.0-beta.12'
          codesign --verify --deep --strict "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: cine12-mac-${{ matrix.label }}
          path: dist/Selector_Cine_365_Mac_*_v9_BETA12.zip
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go y regresiones de escritorio/Android
        run: |
          go test ./...
          node scripts/test_v9_beta12.cjs
      - name: Compilar Windows x64 sin CMD
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-H windowsgui -s -w' -o dist/Selector_Cine_365_Windows_v9_BETA12.exe .
          python3 - <<'PY'
          from pathlib import Path
          b=Path('dist/Selector_Cine_365_Windows_v9_BETA12.exe').read_bytes()
          assert b[:2]==b'MZ'
          n=int.from_bytes(b[0x3c:0x40],'little')
          assert b[n:n+4]==b'PE\x00\x00'
          assert int.from_bytes(b[n+24+68:n+24+70],'little')==2
          PY
          cp BETA12_NOTAS.md dist/LEEME_BETA12.md
          cd dist
          zip -9 Selector_Cine_365_Windows_v9_BETA12.zip Selector_Cine_365_Windows_v9_BETA12.exe LEEME_BETA12.md
          unzip -t Selector_Cine_365_Windows_v9_BETA12.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: cine12-windows
          path: dist/Selector_Cine_365_Windows_v9_BETA12.zip
          if-no-files-found: error

  android_source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests unitarios Android y compilación desde los fuentes
        run: |
          node scripts/test_v9_beta12.cjs
          cd android
          gradle --no-daemon testDebugUnitTest assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

  android_signed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recuperar artefacto EXACTO de Beta12 (sin clave privada)
        uses: actions/download-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_BETA12_unsigned
          repository: cristianbarallobre/selector-cine-365
          run-id: 44780308167
          github-token: ${{ github.token }}
          path: original
      - name: Reconstruir APK firmada original, comprobar SHA256 y certificado
        run: |
          python3 scripts/release/reconstruct_signed_beta12.py original/Selector_Cine_365_Android_v9_BETA12_UNSIGNED.apk scripts/release/beta12_android_signed_delta.b64 dist/Selector_Cine_365_Android_v9_BETA12.apk
          java -jar original/android-tools/lib/apksigner.jar verify --verbose --print-certs dist/Selector_Cine_365_Android_v9_BETA12.apk | tee /tmp/android-verify.txt
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/android-verify.txt
          grep -Fx 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/android-verify.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: b8a17f39e4fa24d7c110d452161425c7524412c3a5a4d7459b1132ffd0825fb6' /tmp/android-verify.txt
          echo 'c94cf58c30933b588e4546c0ce465303a658979b51c60b1bd292e7255cbb5399  dist/Selector_Cine_365_Android_v9_BETA12.apk' | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: cine12-android-firmado
          path: dist/Selector_Cine_365_Android_v9_BETA12.apk
          if-no-files-found: error

  release:
    needs: [mac, windows, android_source, android_signed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cine12-*
          merge-multiple: true
          path: dist
      - name: Verificar las cuatro descargas antes de publicar
        run: |
          test -s dist/Selector_Cine_365_Windows_v9_BETA12.zip
          test -s dist/Selector_Cine_365_Mac_Apple_Silicon_v9_BETA12.zip
          test -s dist/Selector_Cine_365_Mac_Intel_v9_BETA12.zip
          test -s dist/Selector_Cine_365_Android_v9_BETA12.apk
          sha256sum dist/*
      - name: Publicar GitHub Release conjunta Beta12 (4 plataformas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v9.0.0-beta.12
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.apk --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES_v9_BETA12.md --prerelease
          else
            gh release create "$TAG" dist/*.zip dist/*.apk --target "$GITHUB_SHA" --prerelease --title 'Selector Cine 365 v9 Beta 12 — Windows Android Mac' --notes-file RELEASE_NOTES_v9_BETA12.md
          fi
