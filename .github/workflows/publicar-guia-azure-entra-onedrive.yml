name: Publicar manual Azure Entra OneDrive (PDF)
on:
  push:
    branches: [v9-android-beta]
    paths:
      - 'docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.md'
      - 'scripts/generar_guia_azure_entra_onedrive.py'
      - '.github/workflows/publicar-guia-azure-entra-onedrive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar motor PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.4
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Generar manual PDF desde Markdown
        run: |
          python scripts/generar_guia_azure_entra_onedrive.py \
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.md \
            GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf
      - name: Comprobar que el manual es un PDF real
        run: |
          python - <<'PY'
          from pathlib import Path
          pdf=Path("GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf")
          data=pdf.read_bytes()
          assert data.startswith(b"%PDF-"), "El archivo no es PDF"
          assert len(data)>30000, "PDF inesperadamente corto"
          print("PDF valido: ",len(data),"bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365_PDF
          path: GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf
          if-no-files-found: error
      - name: Publicar PDF en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="manual-azure-entra-onedrive-2026-11"
          FILE="GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Manual de configuración Azure, Entra y OneDrive - Selector Cine 365" \
              --notes "Guía en PDF: registro de Entra, cuentas personales, versión de token 2, permisos delegados Microsoft Graph, retorno Android con PKCE, carpeta de OneDrive y solución de errores. Fuente editable y script generador en docs/ y scripts/. No contiene contraseñas ni secretos."
          fi
