name: Probar Android Beta 8 sin publicar
on:
  push:
    branches: [feature/v9-onedrive-android-beta5, feature/v9-onedrive-active-beta6, feature/v9-android-onedrive-pkce-beta7, feature/v9-auto-sync-beta8]
    paths:
      - 'android/**'
      - '.github/workflows/probar-android-v9-beta5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Comprobar JavaScript Android
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          text=pathlib.Path('android/app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?P<attrs>[^>]*)>(?P<js>.*?)</script>',text,re.S|re.I)
          for index,(attrs,js) in enumerate(scripts):
              if 'src=' in attrs or 'application/json' in attrs: continue
              path=pathlib.Path(tempfile.gettempdir()) / f'cine_android_{index}.js'
              path.write_text(js)
              subprocess.run(['node','--check',str(path)],check=True)
          PY
      - name: Validar que ya no se usa código de dispositivo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/java/es/cine365/app/OneDriveCloud.java').read_text()
          m=Path('android/app/src/main/AndroidManifest.xml').read_text()
          assert 'code_challenge_method=S256' in s and 'authorization_code' in s
          assert 'devicecode' not in s and 'onedrive/poll' not in s
          assert 'msal696458fe-0672-47e5-9fdd-aa0332e9884b' in m
          PY
      - name: Compilar APK Beta 8 con inicio Microsoft PKCE
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

