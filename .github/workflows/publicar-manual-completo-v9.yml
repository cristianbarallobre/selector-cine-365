name: Generar y guardar manual completo PDF
on:
  push:
    branches: [v9-android-beta]
    paths:
      - 'docs/MANUAL_COMPLETO_SELECTOR_CINE_365.md'
      - 'scripts/generar_manual_completo.py'
      - '.github/workflows/publicar-manual-completo-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manual-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del manual
        run: |
          python -m pip install --disable-pip-version-check 'mistune>=3,<4' 'weasyprint>=68,<70' 'pypdf>=5,<7'
      - name: Generar manual PDF desde la fuente editable
        run: python scripts/generar_manual_completo.py
      - name: Comprobar páginas, tamaño y contenido del PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf')
          assert p.is_file() and p.stat().st_size>10000, 'Falta PDF o está vacío'
          pdf=PdfReader(p)
          assert len(pdf.pages)>=5, f'El manual es demasiado breve: {len(pdf.pages)} páginas'
          text=' '.join(page.extract_text() or '' for page in pdf.pages)
          for term in ('OneDrive','TMDB','Biblioteca','Estadísticas','Seguridad'):
              assert term in text, f'No aparece {term} en el manual'
          print('PDF comprobado:',len(pdf.pages),'páginas')
          PY
      - name: Guardar PDF en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(pdf): actualizar manual completo Selector Cine 365"
            git push origin HEAD:v9-android-beta
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Manual_Completo_Selector_Cine_365_PDF
          path: docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf
          if-no-files-found: error
