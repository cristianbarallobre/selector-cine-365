name: CI Selector Cine 365 v9 Beta 12 Windows y Android
on:
  push:
    branches: ['feature/v9-beta12-search-statistics']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de sincronización y de interfaz
        run: |
          go test ./...
          node scripts/test_v9_beta12.cjs
      - name: Compilación Windows GUI x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-H windowsgui -s -w' -o dist/Selector_Cine_365_Windows_v9_BETA12.exe .
          python3 - <<'PY'
          from pathlib import Path
          b=Path('dist/Selector_Cine_365_Windows_v9_BETA12.exe').read_bytes()
          assert b[:2]==b'MZ'
          n=int.from_bytes(b[0x3c:0x40],'little')
          assert b[n:n+4]==b'PE\x00\x00'
          assert int.from_bytes(b[n+24+68:n+24+70],'little')==2,'Se debe iniciar sin CMD'
          print('Windows GUI comprobado')
          PY
          cp BETA12_NOTAS.md dist/LEEME_BETA12.md
          cd dist && zip -9 Selector_Cine_365_Windows_v9_BETA12.zip Selector_Cine_365_Windows_v9_BETA12.exe LEEME_BETA12.md
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Windows_v9_BETA12
          path: dist/Selector_Cine_365_Windows_v9_BETA12.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Pruebas de las interfaces
        run: node scripts/test_v9_beta12.cjs
      - name: Compilar APK sin firma y comprobar motor causal Android
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Preparar APK para firmar fuera del repositorio público
        run: |
          mkdir -p dist/android-tools/lib
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Selector_Cine_365_Android_v9_BETA12_UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" dist/android-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/android-tools/lib/apksigner.jar
          cp BETA12_NOTAS.md dist/LEEME_BETA12.md
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_BETA12_unsigned
          path: |
            dist/Selector_Cine_365_Android_v9_BETA12_UNSIGNED.apk
            dist/android-tools/**
            dist/LEEME_BETA12.md
          if-no-files-found: error
