name: Compilar Selector Cine 365 v9 Android beta
on:
  push:
    branches: [v9-android-beta]
    paths:
      - 'android/**'
      - '.github/workflows/construir-android-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # ID de cliente Microsoft Entra: dato publico, nunca un secreto.
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Instalar SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools no están instaladas"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Crear APK Android de prueba
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verificar identificador Microsoft integrado en la APK
        run: |
          CONFIG="android/app/build/generated/source/buildConfig/debug/es/cine365/app/BuildConfig.java"
          test -s "$CONFIG"
          grep -F 'public static final String MICROSOFT_CLIENT_ID = "696458fe-0672-47e5-9fdd-aa0332e9884b";' "$CONFIG"
          echo 'Microsoft Entra client ID integrado y validado.'
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_beta6_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar pre-release de Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Selector_Cine_365_Android_v9_BETA6.apk
          if gh release view v9.0.0-android-beta.6 >/dev/null 2>&1; then
            gh release upload v9.0.0-android-beta.6 Selector_Cine_365_Android_v9_BETA6.apk --clobber
          else
            gh release create v9.0.0-android-beta.6 Selector_Cine_365_Android_v9_BETA6.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Selector Cine 365 - Android v9 beta 6' \
              --notes 'BETA 6 Android: identificador de Microsoft Entra incorporado, botón OneDrive activado, acceso mediante código temporal y elección de carpeta de pruebas. Requiere flujos de cliente público y permisos delegados Files.ReadWrite y User.Read. Sincronización entrante todavía manual y experimental con Windows Beta 5.1. No desinstalar la beta anterior: importa copia JSON. Validar acceso real antes de considerarla estable.'
          fi
