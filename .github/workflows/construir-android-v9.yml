name: Compilar Selector Cine 365 v9 Android beta
on:
  push:
    branches: [v9-android-beta]
    paths:
      - 'android/**'
      - '.github/workflows/construir-android-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # ID de cliente Microsoft Entra: dato publico, nunca un secreto.
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Instalar SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools no están instaladas"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Crear APK Android de prueba
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Comprobar nuevo flujo Microsoft PKCE y retorno de Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          backend=Path('android/app/src/main/java/es/cine365/app/OneDriveCloud.java').read_text()
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          frontend=Path('android/app/src/main/assets/index.html').read_text()
          expected='msal696458fe-0672-47e5-9fdd-aa0332e9884b'
          assert 'code_challenge_method=S256' in backend
          assert 'grant_type","authorization_code"' in backend
          assert '"'+expected+'"' in manifest
          assert 'api/onedrive/poll' not in frontend
          assert 'odCopyCode' not in frontend
          print('PKCE, retorno de navegador y eliminación de código manual: OK')
          PY
      - name: Verificar identificador Microsoft integrado en la APK
        run: |
          CONFIG="android/app/build/generated/source/buildConfig/debug/es/cine365/app/BuildConfig.java"
          test -s "$CONFIG"
          grep -F 'public static final String MICROSOFT_CLIENT_ID = "696458fe-0672-47e5-9fdd-aa0332e9884b";' "$CONFIG"
          echo 'Microsoft Entra client ID integrado y validado.'
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_beta7_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar pre-release de Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Selector_Cine_365_Android_v9_BETA7.apk
          if gh release view v9.0.0-android-beta.7 >/dev/null 2>&1; then
            gh release upload v9.0.0-android-beta.7 Selector_Cine_365_Android_v9_BETA7.apk --clobber
          else
            gh release create v9.0.0-android-beta.7 Selector_Cine_365_Android_v9_BETA7.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Selector Cine 365 - Android v9 beta 7' \
              --notes 'BETA 7 Android: corregido inicio de sesión para OneDrive personal: navegador Microsoft y Authorization Code con PKCE, SIN copiar códigos temporales. REGISTRO NECESARIO: añadir a Microsoft Entra como URI móvil/escritorio msal696458fe-0672-47e5-9fdd-aa0332e9884b://auth. Se mantienen datos locales, caché TMDB y sincronización con revisión manual. APK separada de Beta 6: exportar/importar copia JSON. Autenticación real pendiente de validar en móvil.'
          fi
