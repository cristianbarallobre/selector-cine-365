name: Compilar Selector Cine 365 v9 Android beta
on:
  push:
    branches: [v9-android-beta]
    paths:
      - 'android/**'
      - '.github/workflows/construir-android-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Instalar SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools no están instaladas"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Crear APK Android de prueba
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_beta2_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar pre-release de Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Selector_Cine_365_Android_v9_BETA2.apk
          if gh release view v9.0.0-android-beta.2 >/dev/null 2>&1; then
            gh release upload v9.0.0-android-beta.2 Selector_Cine_365_Android_v9_BETA2.apk --clobber
          else
            gh release create v9.0.0-android-beta.2 Selector_Cine_365_Android_v9_BETA2.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title 'Selector Cine 365 - Android v9 beta 2' \
              --notes 'BETA Android 2: scroll reiniciado por sección, iconos monocromos, carga incremental y tarjetas grandes con carteles TMDB cacheados. Se instala junto a beta 1 para proteger sus datos: exporta/importa las listas si quieres trasladarlas. La sincronización de retorno a Windows aún no es completa.'
          fi
