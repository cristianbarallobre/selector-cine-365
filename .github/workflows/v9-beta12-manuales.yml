name: v9 Beta12 - regenerar manuales PDF
on:
  push:
    branches: ['release/v9-beta12-windows-android-macos', 'main']
    paths:
      - 'docs/MANUAL_COMPLETO_SELECTOR_CINE_365.md'
      - 'docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.md'
      - 'scripts/generar_manual_completo.py'
      - 'scripts/generar_guia_azure_entra_onedrive.py'
      - '.github/workflows/v9-beta12-manuales.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manuales:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de PDF
        run: |
          python -m pip install --disable-pip-version-check 'mistune>=3,<4' 'weasyprint>=68,<70' 'reportlab>=4.4,<5' 'pypdf>=5,<7'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Generar ambos PDF desde Markdown
        run: |
          python scripts/generar_manual_completo.py
          python scripts/generar_guia_azure_entra_onedrive.py docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.md docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf
      - name: Comprobar PDF y texto actualizado
        run: |
          python3 - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          for name,terms in [
            ('MANUAL_COMPLETO_SELECTOR_CINE_365.pdf',['Beta 12','OneDrive','macOS','Todas las listas']),
            ('GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf',['OneDrive','Beta 12','Android'])
          ]:
            p=Path('docs')/name
            assert p.exists() and p.stat().st_size>10000
            doc=PdfReader(p);assert len(doc.pages)>2
            txt='\n'.join(page.extract_text() or '' for page in doc.pages)
            for term in terms:
              assert term in txt, f'{name} no contiene {term}'
            print(name,len(doc.pages),'páginas',p.stat().st_size,'bytes')
          PY
      - name: Publicar manuales y el nuevo historial v9 junto a Beta 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s docs/Selector_Cine_365_Historial_v9_BETA12.pdf
          test -s docs/Selector_Cine_365_Historial_v9_BETA12.docx
          gh release upload v9.0.0-beta.12 \
            docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf \
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf \
            docs/Selector_Cine_365_Historial_v9_BETA12.pdf \
            docs/Selector_Cine_365_Historial_v9_BETA12.docx \
            --clobber
          gh release edit v9.0.0-beta.12 --notes-file RELEASE_NOTES_v9_BETA12.md --prerelease
          echo 'Manual, guía y el historial v9 en Word/PDF publicados en Beta 12.'
      - name: Registrar PDF actualizados sin tocar el histórico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(v9 beta12): actualizar PDF del manual y OneDrive'
            git push origin HEAD:$GITHUB_REF_NAME
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Manuales_Selector_Cine_365_v9_BETA12
          path: |
            docs/MANUAL_COMPLETO_SELECTOR_CINE_365.pdf
            docs/GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365.pdf
          if-no-files-found: error
