name: LAB - pruebas y compilaciones independientes

on:
  push:
    branches: [experimental]
  workflow_dispatch:

# JAMÁS crea releases, tags ni escribe en main.
permissions:
  contents: read

jobs:
  windows:
    name: Windows LAB / regresión Go
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar comportamiento normal y rutas LAB
        run: |
          go test ./... -count=1
          go test -tags lab ./... -run TestAppChannelIsolation -count=1
          node scripts/test_v9_beta13.cjs
          node scripts/test_beta14_desktop_dropdowns.cjs
          node scripts/test_lab_discover_windows.cjs
          node scripts/test_lab_smart_sort_windows.cjs
          node scripts/test_lab_network_windows.cjs
          node scripts/test_lab_visual_polish_windows.cjs
          node scripts/test_lab_filters_windows.cjs
          node scripts/test_lab_discover_fill_windows.cjs
      - name: Compilar Windows LAB (sin firma)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags lab -trimpath -ldflags='-H windowsgui -s -w' -o Selector_Cine_365_LAB-02_12_Windows.exe .
          test -s Selector_Cine_365_LAB-02_12_Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_LAB-02_12_Windows
          path: Selector_Cine_365_LAB-02_12_Windows.exe
          retention-days: 14
          if-no-files-found: error


  windows-native-tests:
    name: Windows LAB / caché y precarga nativas
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Probar TTL, persistencia, aislación y cola en Windows
        shell: pwsh
        run: |
          go test -tags lab -run 'TestLab' -count=1 -v .


  android:
    # Android permanece sin experimentar: compilarlo solo mediante lanzamiento manual.
    if: github.event_name == 'workflow_dispatch'
    name: Android LAB / paquete separado
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Instalar SDK de Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test y APK de laboratorio firmada solo con clave debug
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug -PcineLab
      - name: Comprobar ID independiente
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='es.cine365.app.lab'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "Selector Cine 365 LAB"
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_LAB-01_Android_debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  macos:
    # Mac conserva su versión LAB anterior hasta aprobar la función de Windows.
    if: github.event_name == 'workflow_dispatch'
    name: macOS LAB (Intel y Apple Silicon)
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: Intel
            cc: clang
          - arch: arm64
            label: Apple_Silicon
            cc: 'clang -arch arm64'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compilar app LAB con identificador diferente
        env:
          MAC_ARCH: ${{ matrix.arch }}
          MAC_LABEL: ${{ matrix.label }}
          CC: ${{ matrix.cc }}
        run: bash scripts/build_macos_lab.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_LAB-01_Mac_${{ matrix.label }}
          path: dist/Selector_Cine_365_LAB_${{ matrix.label }}_01.zip
          retention-days: 14
          if-no-files-found: error
