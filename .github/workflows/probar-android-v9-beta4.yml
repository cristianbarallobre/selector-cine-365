name: Probar Android Beta 4 sin publicar
on:
  push:
    branches: [feature/v9-sync-and-stats-beta4]
    paths:
      - 'android/**'
      - '.github/workflows/probar-android-v9-beta4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar SDK Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de pruebas (sin publicar)
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
