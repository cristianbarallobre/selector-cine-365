name: CI Android Beta 12.1 - notch, edge-to-edge y firma compatible
on:
  push:
    branches: ['fix/android-safe-area-cutout-v9-beta12-1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-safe-area:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MICROSOFT_CLIENT_ID: '696458fe-0672-47e5-9fdd-aa0332e9884b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar SDK Android 35 y herramientas de firma
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Pruebas de regresión y notch de Android 15
        run: |
          node scripts/test_android_safe_area_beta12_1.cjs
          test -f android/app/src/main/java/es/cine365/app/MainActivity.java
      - name: Compilar Beta 12.1 y ejecutar tests nativos de sincronización
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: Comprobar que no cambia la identidad instalada y el archivo APK de salida
        run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          grep -F "applicationId 'es.cine365.app'" android/app/build.gradle
          grep -F "versionCode 9013" android/app/build.gradle
          grep -F "versionName '9.0.0-beta.12.1'" android/app/build.gradle
          mkdir -p dist/android-tools/lib
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Selector_Cine_365_Android_v9_BETA12_1_UNSIGNED.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" dist/android-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/android-tools/lib/apksigner.jar
          sha256sum dist/Selector_Cine_365_Android_v9_BETA12_1_UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Selector_Cine_365_Android_v9_BETA12_1_unsigned
          path: |
            dist/Selector_Cine_365_Android_v9_BETA12_1_UNSIGNED.apk
            dist/android-tools/**
          if-no-files-found: error
