name: Documentación v9 Beta12 - historial Word y PDF
on:
  push:
    branches: ['docs/auditoria-v9-beta12-2026-11']
    paths:
      - '.github/workflows/generar-historial-v9-beta12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar-historial-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout revisión documental
        uses: actions/checkout@v4
      - name: Instalar Pandoc, LibreOffice y conversión a imágenes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fonts-liberation poppler-utils
          python -m pip install --disable-pip-version-check pypdf python-docx
      - name: Convertir el historial actual de Markdown a Word y PDF
        run: |
          pandoc docs/HISTORIAL_V9_BETA12.md --from=gfm --to=docx \
            --reference-doc=docs/Selector_de_Cine_365_Historial_de_versiones_v8.1.1.docx \
            --metadata=lang:es-ES --metadata=title:'Selector Cine 365 — Historial de versiones v9 Beta 12' \
            -o docs/Selector_Cine_365_Historial_v9_BETA12.docx
          mkdir -p /tmp/cine365-v9-lo
          libreoffice -env:UserInstallation=file:///tmp/cine365-v9-lo/profile \
            --headless --convert-to pdf --outdir docs docs/Selector_Cine_365_Historial_v9_BETA12.docx
          pdftoppm -f 1 -l 1 -r 100 -png -singlefile \
            docs/Selector_Cine_365_Historial_v9_BETA12.pdf /tmp/cine365_historial_portada
      - name: Validar los dos formatos y el contenido de la v9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          base = Path('docs/Selector_Cine_365_Historial_v9_BETA12')
          pdf = base.with_suffix('.pdf')
          docx = base.with_suffix('.docx')
          assert pdf.is_file() and pdf.stat().st_size > 20000, 'Falta PDF completo'
          assert docx.is_file() and docx.stat().st_size > 20000, 'Falta Word completo'
          reader = PdfReader(pdf)
          assert len(reader.pages) >= 4, 'Documento demasiado corto'
          whole=' '.join(p.extract_text() or '' for p in reader.pages)
          for term in ('Beta 12','Beta 11','Beta 10','Beta 9','Android','Windows','macOS','OneDrive','v8.2','v8.1.1'):
              assert term in whole, f'El PDF no contiene {term}'
          word = Document(docx)
          para = '\n'.join(p.text for p in word.paragraphs)
          assert 'Beta 12' in para and 'Beta 9' in para
          print('PDF',len(reader.pages),'páginas',pdf.stat().st_size,'bytes')
          print('Word',len(word.paragraphs),'párrafos',docx.stat().st_size,'bytes')
          PY
      - name: Guardar Word y PDF actuales en la rama de documentación
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Selector_Cine_365_Historial_v9_BETA12.docx docs/Selector_Cine_365_Historial_v9_BETA12.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'docs(v9 Beta12): generar historial actualizado en Word y PDF'
            git push origin HEAD:docs/auditoria-v9-beta12-2026-11
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Historial_Selector_Cine_365_v9_BETA12_DOCX_PDF
          path: |
            docs/Selector_Cine_365_Historial_v9_BETA12.docx
            docs/Selector_Cine_365_Historial_v9_BETA12.pdf
          if-no-files-found: error
