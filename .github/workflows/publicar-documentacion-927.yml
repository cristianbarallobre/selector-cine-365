name: Documentación pública 9.2.7
on:
  push:
    branches: [docs/render-9.2.7, docs/notes-9.2.7]
permissions:
  contents: write
jobs:
  manuales:
    if: github.ref == 'refs/heads/docs/render-9.2.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito poppler-utils
      - name: Renderizar y comprobar las guías
        run: |
          for name in MANUAL_COMPLETO_SELECTOR_CINE_365 GUIA_SINCRONIZACION_SEGURA GUIA_AZURE_ENTRA_ONEDRIVE_SELECTOR_CINE_365; do
            profile="file://$RUNNER_TEMP/lo-$name"
            libreoffice -env:UserInstallation="$profile" --headless --convert-to pdf --outdir "$RUNNER_TEMP" "docs/$name.docx"
            test -s "$RUNNER_TEMP/$name.pdf"
            pdftotext "$RUNNER_TEMP/$name.pdf" "$RUNNER_TEMP/$name.txt"
            grep -q '9.2.7' "$RUNNER_TEMP/$name.txt"
            cp "$RUNNER_TEMP/$name.pdf" "docs/$name.pdf"
            git add "docs/$name.pdf"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: renderizar PDF a partir de las guías Word de 9.2.7'
          git push origin HEAD:refs/heads/docs/render-9.2.7
  notas:
    if: github.ref == 'refs/heads/docs/notes-9.2.7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view --json tagName --jq .tagName)" = 'v9.2.7-desktop'
          gh release edit v9.2.7-desktop --notes-file RELEASE_NOTES_v9_2_7_DESKTOP.md
