plugins { id 'com.android.application' }

android {
    namespace 'es.cine365.app'
    compileSdk 35
    defaultConfig {
        // Producción mantiene el ID histórico; solo la compilación explícita
        // -PcineFreshInstall crea otra aplicación, sin intento de actualización.
        applicationId 'es.cine365.app'
        if (project.hasProperty('cineFreshInstall')) {
            applicationId 'es.cine365.app.limpia'
        }
        resValue 'string', 'cine_app_name', project.hasProperty('cineFreshInstall') ? 'Selector Cine 365 (Limpia)' : 'Selector Cine 365'
        minSdk 26
        targetSdk 35
        versionCode 9026
        versionName '9.0.0-beta.13.12'
    }
    buildFeatures { buildConfig true }
    // Public identifier, NOT a secret. Configured by repository owner in GitHub Actions Variables.
    def microsoftClientId = (System.getenv('MICROSOFT_CLIENT_ID') ?: '').trim()
    defaultConfig { buildConfigField 'String', 'MICROSOFT_CLIENT_ID', '"' + microsoftClientId.replace('"','') + '"' }
    // Identificador permanente, también para futuras actualizaciones firmadas.
    // No utilizar sufijos de versión en applicationId.
    buildTypes {
        debug { }
        release { }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Regression tests for causal syncing, using real JSONObject on the JVM.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
