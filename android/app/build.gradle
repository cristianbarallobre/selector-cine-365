plugins { id 'com.android.application' }

android {
    namespace 'es.cine365.app'
    compileSdk 35
    defaultConfig {
        // Producción mantiene el ID histórico; solo la compilación explícita
        // -PcineFreshInstall crea otra aplicación, sin intento de actualización.
        applicationId 'es.cine365.app'
        if (project.hasProperty('cineFreshInstall')) {
            applicationId 'es.cine365.app.limpia'
        }
        if (project.hasProperty('cineLab')) {
            // Un APK LAB nunca comparte identificador ni datos privados con producción.
            applicationId 'es.cine365.app.lab'
        }
        resValue 'string', 'cine_app_name', project.hasProperty('cineLab') ? 'Selector Cine 365 LAB' : (project.hasProperty('cineFreshInstall') ? 'Selector Cine 365 (Limpia)' : 'Selector Cine 365')
        minSdk 26
        targetSdk 35
        versionCode 9027
        versionName '9.0.0-beta.13.13'
    }
    buildFeatures { buildConfig true }
    // Public identifier, NOT a secret. Configured by repository owner in GitHub Actions Variables.
    // LAB bloquea OAuth/Graph hasta registrar un cliente Microsoft específico para LAB;
    // el esquema de retorno de la aplicación estable no debe compartirse.
    def microsoftClientId = project.hasProperty('cineLab') ? '' : (System.getenv('MICROSOFT_CLIENT_ID') ?: '').trim()
    defaultConfig {
        buildConfigField 'String', 'MICROSOFT_CLIENT_ID', '"' + microsoftClientId.replace('"','') + '"'
        buildConfigField 'boolean', 'LAB_MODE', project.hasProperty('cineLab') ? 'true' : 'false'
    }
    // Identificador permanente, también para futuras actualizaciones firmadas.
    // No utilizar sufijos de versión en applicationId.
    buildTypes {
        debug { }
        release { }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Regression tests for causal syncing, using real JSONObject on the JVM.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
