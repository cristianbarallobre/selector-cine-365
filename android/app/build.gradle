plugins { id 'com.android.application' }

android {
    namespace 'es.cine365.app'
    compileSdk 35
    defaultConfig {
        applicationId 'es.cine365.app'
        minSdk 26
        targetSdk 35
        versionCode 9008
        versionName '9.0.0-beta.8'
    }
    buildFeatures { buildConfig true }
    // Public identifier, NOT a secret. Configured by repository owner in GitHub Actions Variables.
    def microsoftClientId = (System.getenv('MICROSOFT_CLIENT_ID') ?: '').trim()
    defaultConfig { buildConfigField 'String', 'MICROSOFT_CLIENT_ID', '"' + microsoftClientId.replace('"','') + '"' }
    buildTypes {
        debug {
            // Install alongside the old Android test app; never uninstall user data.
            applicationIdSuffix '.v9beta8'
            versionNameSuffix '-test'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
